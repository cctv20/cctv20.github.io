<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>博客开通：为什么我要建一个能被百度搜到的个人博客 - Ikeda 的博客</title><meta name="description" content="Ikeda 的个人博客正式开通，记录建站选择、永久免费方案，以及今后要写的内容。"></head><body><article><h1>博客开通：为什么我要建一个能被百度搜到的个人博客</h1><p>2026-11-15</p><p>今天把个人博客搭起来了。我想要的很简单：一个永久免费、地址不变、自己说了算的博客，写完的文章能在百度里搜到，而不是发完就沉底。</p><p>今后这里主要写三类内容：陕北民歌相关的记录和整理、日常阅读与生活记录、工具和探索笔记。第一批文章会从陕北民歌开始，把视频之外的文字版留在这里，方便搜索和查阅。</p><p>这个博客使用静态页面，配有站点地图 sitemap.xml 和 robots.txt，并会提交到百度搜索资源平台，方便百度抓取和收录。</p></article><p><a href="/">返回首页</a></p></body></html>
