<div class="wrap"><h2 class="sec">全文检索</h2><p style="color:var(--gray);font-size:14px;margin-bottom:12px">对全部 1122 篇文章的标题与正文做子串检索，标题命中优先。基准自检：吴天明 69 · 万里长征 6 · 子洲 57。</p><input id="q" placeholder="输入关键词，如：吴天明 / 路遥 / 子洲"><p id="cnt" style="margin:10px 0;color:var(--gray)"></p><div class="sres" id="out"></div></div>
<footer><span class="seal">月光</span><br>何志铭文章与影像档案 · 2016–2026<br>静态版原型（与 WordPress 版并行对比中）</footer>
<script src="../search-data-1.js"></script><script src="../search-data-2.js"></script><script>
window.YG_SEARCH = window.YG_SEARCH_1.concat(window.YG_SEARCH_2);
const inp=document.getElementById('q'),out=document.getElementById('out'),cnt=document.getElementById('cnt');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function hl(s,q){return esc(s).split(esc(q)).join('<mark>'+esc(q)+'</mark>')}
inp.addEventListener('input',()=>{const q=inp.value.trim();out.innerHTML='';cnt.textContent='';
if(q.length<1)return;const res=[];
for(const p of window.YG_SEARCH){const ti=p.t.includes(q),bi=p.x.includes(q);if(ti||bi)res.push([ti?0:1,p])}
res.sort((a,b)=>a[0]-b[0]||(a[1].d<b[1].d?1:-1));cnt.textContent='共 '+res.length+' 篇';
for(const [,p] of res.slice(0,100)){let sn='';const i=p.x.indexOf(q);
sn=i>=0?p.x.slice(Math.max(0,i-40),i+80):p.x.slice(0,110);
out.innerHTML+='<a href="../'+p.s+'/index.html"><span class="t">'+hl(p.t,q)+'</span> <span style="color:var(--gray);font-size:13px">'+p.d+'</span><div class="s">'+hl(sn,q)+'</div></a>'}});
inp.focus();</script></body></html>
